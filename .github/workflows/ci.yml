name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sofia
          POSTGRES_PASSWORD: sofia123
          POSTGRES_DB: sofia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sofia" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DSN: postgresql://sofia:sofia123@127.0.0.1:5432/sofia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt ruff bandit pip-audit
      - name: Lint
        run: ruff check api --output-format=github
      - name: Architecture boundaries
        working-directory: api
        run: pytest -q tests/test_architecture_boundaries.py tests/test_domain_intelligence.py
      - name: Tests
        working-directory: api
        run: pytest -q
      - name: Security
        run: |
          bandit -q -r api -x api/tests -ll
          pip-audit -r api/requirements.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t sofia-ci ./api
      - name: Smoke test
        run: |
          docker run -d --name sofia-smoke -p 8000:8000 sofia-ci uvicorn main:app --host 0.0.0.0 --port 8000 --lifespan off
          for i in {1..30}; do curl --fail http://127.0.0.1:8000/health && exit 0; sleep 2; done
          docker logs sofia-smoke
          exit 1
