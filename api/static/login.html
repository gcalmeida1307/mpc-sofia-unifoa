<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · SOFIA</title><link rel="stylesheet" href="/ui/styles.css"></head><body class="login-body"><main class="login-card"><div class="brand large"><span></span>SOFIA</div><p class="eyebrow">Acesso seguro</p><h1>Entre na plataforma</h1><form id="login-form"><label>Usuário<input id="username" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><label>Código TOTP<input id="otp" inputmode="numeric" maxlength="6" required></label><button>Entrar</button></form><button class="link" id="first">Configurar primeiro acesso</button><button class="link" id="request">Solicitar acesso</button><p id="message"></p><section id="setup" hidden><h2>Primeiro acesso</h2><p>Guarde a chave no autenticador e informe o código gerado.</p><code id="secret"></code><form id="setup-form"><label>Nova senha<input id="new-password" type="password" required></label><label>Código TOTP<input id="setup-otp" inputmode="numeric" required></label><button>Ativar conta</button></form></section><section id="access" hidden><h2>Solicitar acesso</h2><form id="access-form"><label>Usuário<input id="access-user" required></label><label>Nome<input id="access-name" required></label><label>E-mail<input id="access-email" type="email" required></label><label>Motivo<textarea id="access-reason"></textarea></label><button>Enviar solicitação</button></form></section></main><script src="/ui/login.js"></script></body></html>
