<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Recuperar senha · SOFIA</title><link rel="stylesheet" href="/ui/styles.css?v=20260807-auth"></head><body class="auth-page" data-auth-view="reset"><header class="auth-topbar"><a class="brand large" href="/ui/login.html"><span></span>SOFIA</a><button type="button" class="theme-toggle" data-theme-toggle><span data-theme-icon>◐</span><span data-theme-label>Tema</span></button></header><main class="auth-shell auth-shell-focused"><section class="auth-card auth-card-wide"><a class="back-link" href="/ui/login.html">← Voltar para o login</a><header><p class="eyebrow">Conta protegida</p><h1>Redefinir senha</h1><p>Por segurança, um administrador precisa autorizar a redefinição e fornecer um código temporário.</p></header><div class="info-banner"><strong>Ainda não recebeu o código?</strong><span>Entre em contato com um administrador da SOFIA usando seu e-mail cadastrado.</span></div><form id="reset-form" class="auth-form"><label>Usuário<input id="reset-user" autocomplete="username" placeholder="nome.sobrenome" required autofocus></label><label>Código temporário<input id="reset-token" autocomplete="one-time-code" placeholder="Código fornecido após a autorização" required></label><label>Nova senha<div class="password-field"><input id="reset-password" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" required><button type="button" data-password-toggle>Exibir</button></div><small>Use maiúscula, minúscula e pelo menos um símbolo.</small></label><label>Código do Google Authenticator<input id="reset-otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="000 000" required></label><button class="primary">Atualizar senha</button></form><p id="message" class="auth-message" role="status" aria-live="polite"></p></section></main><script src="/ui/theme.js?v=20260807-auth"></script><script src="/ui/password-reset.js?v=20260807-auth"></script></body></html>
