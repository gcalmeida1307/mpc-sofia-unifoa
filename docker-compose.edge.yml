services:
  caddy:
    image: caddy:2-alpine
    container_name: sofia_edge
    restart: unless-stopped
    environment:
      SOFIA_PUBLIC_HOST: ${SOFIA_PUBLIC_HOST:?configure SOFIA_PUBLIC_HOST}
      TLS_CONTACT_EMAIL: ${TLS_CONTACT_EMAIL:?configure TLS_CONTACT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sofia-network
    depends_on:
      - sofia-api

volumes:
  caddy_data:
  caddy_config:
