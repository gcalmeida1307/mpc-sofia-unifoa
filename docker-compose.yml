services:
  sofia-api:
     build:
       context: ./api

     container_name: sofia_api

     restart: unless-stopped

     environment:
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
        ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
        ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-1024}
        GRAFANA_URL: ${GRAFANA_URL:-http://sofia_grafana:3000}
        GRAFANA_TOKEN: ${GRAFANA_TOKEN:-}
        SMTP_HOST: ${SMTP_HOST:-}
        SMTP_PORT: ${SMTP_PORT:-587}
        SMTP_USER: ${SMTP_USER:-}
        SMTP_PASSWORD: ${SMTP_PASSWORD:-}
        SMTP_FROM: ${SMTP_FROM:-}
        SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
        ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
        POSTGRES_DSN: postgresql://${POSTGRES_USER:-sofia}:${POSTGRES_PASSWORD:-change-this-strong-password}@sofia_postgres:5432/${POSTGRES_DB:-sofia}
        OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://sofia_ollama:11434}
        OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:1.5b}"
        OLLAMA_FALLBACK_MODEL: "${OLLAMA_FALLBACK_MODEL:-}"
        OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
        OLLAMA_MODE: ${OLLAMA_MODE:-native}
        SECURITY_ADMIN_API_KEY: ${SECURITY_ADMIN_API_KEY:-}
        SECURITY_MFA_TOTP_SECRET: ${SECURITY_MFA_TOTP_SECRET:-}
        AUTH_BOOTSTRAP_TOKEN: ${AUTH_BOOTSTRAP_TOKEN:-}
        REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30}
        REQUEST_RATE_LIMIT_PER_MINUTE: ${REQUEST_RATE_LIMIT_PER_MINUTE:-120}
        SNAPSHOT_INTERVAL_SECONDS: ${SNAPSHOT_INTERVAL_SECONDS:-30}
        AUTONOMOUS_INVESTIGATION_INTERVAL_SECONDS: ${AUTONOMOUS_INVESTIGATION_INTERVAL_SECONDS:-90}
        AI_METRICS_WINDOW_HOURS: ${AI_METRICS_WINDOW_HOURS:-24}

     volumes:
       - ./api:/app
       - ./docs:/app/docs

     ports:
       - "${SOFIA_BIND_HOST:-0.0.0.0}:8080:8000"

     networks:
       - sofia-network
     depends_on:
       postgres:
         condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: sofia_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - sofia-network

  redis:
    image: redis:7-alpine
    container_name: sofia_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - sofia-network

  postgres:
    image: postgres:16
    container_name: sofia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sofia}
      POSTGRES_USER: ${POSTGRES_USER:-sofia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-now}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      GRAFANA_POSTGRES_PASSWORD: ${GRAFANA_POSTGRES_PASSWORD}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/conf/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sofia} -d ${POSTGRES_DB:-sofia}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sofia-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sofia_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - sofia-network

  n8n:
    image: n8nio/n8n:latest
    container_name: sofia_n8n
    restart: unless-stopped
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      GENERIC_TIMEZONE: UTC
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - sofia-network

  prometheus:
    image: prom/prometheus:latest
    container_name: sofia_prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d", "--storage.tsdb.path=/prometheus"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 512m
    networks:
      - sofia-network

  loki:
    image: grafana/loki:latest
    container_name: sofia_loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    mem_limit: 512m
    networks:
      - sofia-network

  alloy:
    image: grafana/alloy:latest
    container_name: sofia_alloy
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    mem_limit: 256m
    networks:
      - sofia-network

  grafana:
    image: grafana/grafana:latest
    container_name: sofia_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-sofiaadmin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      POSTGRES_DB: ${POSTGRES_DB:-sofia}
      GRAFANA_POSTGRES_PASSWORD: ${GRAFANA_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - postgres
    mem_limit: 512m
    networks:
      - sofia-network

volumes:
  postgres_data:
  qdrant_data:
  n8n_data:
  ollama_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  sofia-network:
    driver: bridge
