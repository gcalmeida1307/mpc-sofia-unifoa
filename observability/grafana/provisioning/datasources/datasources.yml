apiVersion: 1
prune: true
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://sofia_prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://sofia_loki:3100
    editable: false
  - name: SOFIA PostgreSQL
    uid: sofia-postgres
    type: postgres
    access: proxy
    url: sofia_postgres:5432
    user: grafana_reader
    database: ${POSTGRES_DB}
    editable: false
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_POSTGRES_PASSWORD}
